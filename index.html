<style>

:root{
  --bg:#0f172a;
  --card:rgba(255,255,255,0.06);
  --text:#fff;
  --border:rgba(34,197,94,0.35);
}

body.light{
  --bg:#f1f5f9;
  --card:#fff;
  --text:#111827;
  --border:#22c55e;
}

body{
  margin:0;
  font-family: 'Noto Nastaliq Urdu', serif;
  background:var(--bg);
  color:var(--text);
  direction: rtl;
}

/* MAIN */
.main{padding:15px;}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#menuBtn{
  font-size:25px;
  background:none;
  border:none;
  color:var(--text);
  cursor:pointer;
}

.title{
  position:absolute;
  left:50%;
  top:10px;
  transform:translateX(-50%);
  font-size:40px;
  font-weight:900;
  letter-spacing:0px;

  background: linear-gradient(
    90deg,
    red,
    orange,
    yellow,
    green,
    cyan,
    blue,
    violet,
    red
  );

  background-size:300%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  animation: gradientMove 5s linear infinite;

  text-shadow: 
    0 0 8px rgba(255,255,255,0.15),
    0 0 15px rgba(255,255,255,0.1);
}

/* 🔥 Smooth color flow */
@keyframes gradientMove{
  0%{ background-position:0%; }
  100%{ background-position:300%; }
}

/* 💎 Depth layer (no movement) */
.title::after{
  content:"";
  position:absolute;
  inset:0;
  background: inherit;
  filter: blur(20px);
  z-index:-1;
  opacity:0.4;
}

.title{
  position:absolute;
  left:50%;
  top:10px;              /* 👈 yahan se up/down control hoga */
  transform:translateX(-50%);
  font-size:30px !important;
  font-weight:800;
}

#search{
  width:90%;
  margin:50px auto;   /* center karega */
  padding:13px;
  border-radius:10px;
  border:none;
  display:block;      /* center ke liye zaroori */
  font-weight:800;    /* bold text */
  text-align:center;  /* text bhi center */
}

/* CARD */
.card{
  margin-top:15px;
  padding:15px;
  border-radius:15px;
  background:var(--card);
  border:1px solid var(--border);
  position:relative;
}

.text{
  margin-top:40px;
  font-size:14px;
  line-height:2;
}

/* ACTION */
.actionBox{
  position:absolute;
  top:10px;
  left:10px;
  display:flex;
  gap:12px;
}

.actionBox button{
  background:none;
  border:none;
  font-size:18px;
  cursor:pointer;
  color:var(--text);
}

/* ❤️ TRANSPARENT HEART */
.like i{
  color:transparent;
  -webkit-text-stroke:1.6px var(--text);
  transition:0.2s;
}

.like.liked i{
  color:red;
  -webkit-text-stroke:0;
  transform:scale(1.2);
}

/* DRAWER */
.drawer{
  position:fixed;
  top:0;
  right:0;
  width:150px;
  height:50%;
  background:#111827;
  border-radius:35px 0 0 35px;
  transform:translateX(100%);
  transition:0.35s;
  padding-top:60px;
}

.drawer.open{transform:translateX(0);}

#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
}

#overlay.show{display:block;}

/* ✅ CLOSE BUTTON */
#closeBtn{
  position:absolute;
  top:12px;
  left:12px;
  background:none;
  border:none;
  color:#22c55e;
  font-size:22px;
  cursor:pointer;
}

/* MENU */
.menuItem{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px;
  color:#22c55e;
  text-decoration:none;
  cursor:pointer;
}

/* ICON ANIMATION */
.icon-spin{
  animation:spin 0.4s linear;
}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

#loadMore{
  margin:20px auto;
  display:block;
  padding:10px 15px;
  border:none;
  border-radius:10px;
}
</style>
</head>

const autoQuotes = Array.from({length:600},(_,i)=>({
  id:i+100,
  show:"یہ قول نمبر "+(i+1),
  copy:"text "+(i+1)
}));

const quotes = [...customQuotes, ...autoQuotes];

let favorites = JSON.parse(localStorage.getItem("favs")) || [];
let filtered = [...quotes];
let page = 1;
let limit = 20;

/* RENDER */
function render(){
  const c = document.getElementById("container");
  c.innerHTML = "";

  filtered.slice(0,page*limit).forEach(q=>{
    let liked = favorites.includes(q.id);

    c.innerHTML += `
    <div class="card">

      <div class="actionBox">

        <button class="like ${liked?'liked':''}" onclick="toggleLike(${q.id})">
          <i class="fas fa-heart"></i>
        </button>

        <button onclick="copyText('${q.copy}')">
          <i class="fas fa-copy"></i>
        </button>

      </div>

      <div class="text">${q.show}</div>
    </div>`;
  });
}

/* LIKE */
function toggleLike(id){
  if(favorites.includes(id)){
    favorites = favorites.filter(f=>f!==id);
  }else{
    favorites.push(id);
  }
  localStorage.setItem("favs",JSON.stringify(favorites));
  render();
}

/* FAVORITES */
function showFavs(){
  filtered = quotes.filter(q=>favorites.includes(q.id));
  page=1;
  render();
  closeDrawer();
}

/* ALL */
function showAll(){
  filtered=[...quotes];
  page=1;
  render();
  closeDrawer();
}

/* COPY */
function copyText(txt){
  navigator.clipboard.writeText(txt);
}

/* LOAD */
function loadMore(){
  page++;
  render();
}

/* SEARCH */
function searchQuotes(){
  let v=document.getElementById("search").value.toLowerCase();
  filtered = quotes.filter(q=>q.show.toLowerCase().includes(v));
  page=1;
  render();
}

/* DRAWER */
function openDrawer(){
  drawer.classList.add("open");
  overlay.classList.add("show");
}

function closeDrawer(){
  drawer.classList.remove("open");
  overlay.classList.remove("show");
}

/* THEME */
function toggleTheme(){
  const icon = document.getElementById("themeIcon");

  icon.classList.add("icon-spin");
  setTimeout(()=>icon.classList.remove("icon-spin"),400);

  document.body.classList.toggle("light");

  if(document.body.classList.contains("light")){
    icon.classList.replace("fa-moon","fa-sun");
    localStorage.setItem("theme","light");
  }else{
    icon.classList.replace("fa-sun","fa-moon");
    localStorage.setItem("theme","dark");
  }
}

/* MUSIC */
function toggleMusic(){
  const m = document.getElementById("bgMusic");
  const icon = document.getElementById("musicIcon");

  icon.classList.add("icon-spin");
  setTimeout(()=>icon.classList.remove("icon-spin"),400);

  if(m.paused){
    m.play();
    icon.classList.replace("fa-music","fa-pause");
  }else{
    m.pause();
    icon.classList.replace("fa-pause","fa-music");
  }
}

render();
